name: Publish verified diagnostic draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated diagnostic tag and draft release
        required: true
        type: string
      version_code:
        description: Expected positive Android versionCode
        required: true
        type: string
      apk_sha256:
        description: Expected lowercase SHA-256 of the ARM64 diagnostic APK
        required: true
        type: string

jobs:
  publish-diagnostic-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      VERSION_CODE: ${{ inputs.version_code }}
      APK_SHA256: ${{ inputs.apk_sha256 }}
      EXPECTED_CERT_SHA256: ffee4a25472705834a1fdb680fbae4ffce31e02d472fa7897765b767c307b709
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: android-actions/setup-android@v3
      - name: Install pinned APK verification tools
        run: sdkmanager "build-tools;36.0.0"
      - name: Verify draft, assets, APK, and tag
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^diagnostic-v[0-9]+\.[0-9]+\.[0-9]+-alpha[0-9]+$ ]]
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          [[ "$APK_SHA256" =~ ^[0-9a-f]{64}$ ]]

          test "$(git cat-file -t "refs/tags/$TAG")" = tag
          tag_target="$(git rev-parse "refs/tags/$TAG^{}")"
          test "$(git rev-parse HEAD)" = "$tag_target"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$tag_target" origin/main

          release_json="$RUNNER_TEMP/release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$release_json"
          test "$(jq -r .draft "$release_json")" = true
          test "$(jq -r .prerelease "$release_json")" = true
          test "$(jq -r .tag_name "$release_json")" = "$TAG"

          apk="FOXConnect-v${VERSION_CODE}-debug-arm64-v8a.apk"
          expected_assets="$(printf '%s\n' "$apk" "$apk.sha256" SHA256SUMS VERIFICATION.txt | sort)"
          actual_assets="$(jq -r '.assets[].name' "$release_json" | sort)"
          test "$actual_assets" = "$expected_assets"

          mkdir release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets
          cd release-assets

          actual_hash="$(sha256sum "$apk" | cut -d' ' -f1)"
          test "$actual_hash" = "$APK_SHA256"
          expected_line="$APK_SHA256  $apk"
          test "$(cat "$apk.sha256")" = "$expected_line"
          test "$(cat SHA256SUMS)" = "$expected_line"
          grep -Fqx "Release tag: $TAG" VERIFICATION.txt
          grep -Fqx "Version code: $VERSION_CODE" VERIFICATION.txt
          grep -Fqx "Final SHA-256: $APK_SHA256" VERIFICATION.txt
          grep -Fqx "Release tag target (code plus final documentation): $tag_target" VERIFICATION.txt

          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          badging="$($build_tools/aapt dump badging "$apk")"
          package_name="$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          apk_code="$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")"
          test "$package_name" = com.foxconnect.app.debug
          test "$apk_code" = "$VERSION_CODE"

          signer="$RUNNER_TEMP/signer.txt"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" > "$signer"
          grep -Fqx 'Verified using v1 scheme (JAR signing): false' "$signer"
          grep -Fqx 'Verified using v2 scheme (APK Signature Scheme v2): true' "$signer"
          grep -Fqx 'Verified using v3 scheme (APK Signature Scheme v3): false' "$signer"
          grep -Fqx 'Verified using v3.1 scheme (APK Signature Scheme v3.1): false' "$signer"
          grep -Fqx 'Verified using v4 scheme (APK Signature Scheme v4): false' "$signer"
          cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$signer")"
          test "$cert" = "$EXPECTED_CERT_SHA256"
          "$build_tools/zipalign" -c -P 16 -v 4 "$apk"

          packaged_abis="$(unzip -Z1 "$apk" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u)"
          test "$packaged_abis" = arm64-v8a

          mkdir "$RUNNER_TEMP/dex"
          (cd "$RUNNER_TEMP/dex" && unzip -q "$OLDPWD/$apk" 'classes*.dex')
          if grep -aER --binary-files=text -E 'github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' "$RUNNER_TEMP/dex"; then
            echo 'Credential-like pattern found in APK bytecode' >&2
            exit 1
          fi
      - name: Publish with the ephemeral GitHub Actions token
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
      - name: Verify published state
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .draft)" = false
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .prerelease)" = true
